services:
  db:
    image: postgres:16-alpine
    container_name: ventas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ventas_tcsw}
      POSTGRES_USER: ${POSTGRES_USER:-ventas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ventas_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ventas_user} -d ${POSTGRES_DB:-ventas_tcsw}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: ventas-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ventas_tcsw}
      DB_USER: ${POSTGRES_USER:-ventas_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ventas_pass}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/productos >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ventas-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-4200}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
