services:
  db:
    image: postgres:16-alpine
    container_name: ventas-postgres
    restart: always
    environment:
      POSTGRES_DB: ventas_tcsw
      POSTGRES_USER: ventas_user
      POSTGRES_PASSWORD: ventas_pass
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
