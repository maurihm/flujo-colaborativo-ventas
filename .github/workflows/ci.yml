name: CI - Candidato de Liberacion TCSW Ventas

on:
  push:
    branches:
      - main
      - "feature/c04-*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-build-test:
    name: Backend Java 11 + PostgreSQL 16 + JaCoCo
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ventas_tcsw
          POSTGRES_USER: ventas_user
          POSTGRES_PASSWORD: ventas_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ventas_user -d ventas_tcsw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Inicializar esquema relacional en PostgreSQL
        env:
          PGPASSWORD: ventas_pass
        run: psql -h localhost -U ventas_user -d ventas_tcsw -f src/main/resources/schema.sql

      - name: Configurar JDK 11 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Ejecutar pruebas JUnit 5, ArchUnit, JaCoCo y empaquetar JAR
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ventas_tcsw
          DB_USER: ventas_user
          DB_PASSWORD: ventas_pass
        run: xvfb-run -a mvn -B clean package

      - name: Publicar artefacto JAR del candidato de liberacion
        uses: actions/upload-artifact@v4
        with:
          name: ventas-tcsw-jar
          path: target/ventas-tcsw-*.jar

      - name: Publicar reporte de cobertura JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/

  frontend-build-test:
    name: Frontend Angular 20 + Karma Headless + Build Produccion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-angular
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Habilitar sandbox de usuario para ChromeHeadless en Ubuntu 24.04
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Instalar dependencias limpias con npm ci
        run: npm ci

      - name: Ejecutar pruebas unitarias de Angular en ChromeHeadless
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Compilar bundle optimizado de produccion
        run: npm run build -- --configuration production

      - name: Publicar bundle estatico de Angular
        uses: actions/upload-artifact@v4
        with:
          name: frontend-angular-dist
          path: frontend-angular/dist/frontend-angular/browser/

  docker-compose-e2e:
    name: Despliegue Limpio y Smoke Test E2E (Docker Compose)
    runs-on: ubuntu-latest
    needs:
      - backend-build-test
      - frontend-build-test
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Construir y levantar pila completa en contenedores limpios
        env:
          DB_PORT: "5435"
          API_PORT: "8080"
          WEB_PORT: "4200"
        run: docker compose up -d --build

      - name: Verificar recorrido E2E (Frontend Nginx + API REST + PostgreSQL)
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4200/api/productos || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          curl -fsS http://localhost:4200/ | grep -q "<app-root"
          curl -fsS -X POST http://localhost:4200/api/productos \
            -H "Content-Type: application/json" \
            -d '{"codigo":9401,"nombre":"Producto CI","precio":500.00,"existencia":10}'
          curl -fsS -X POST http://localhost:4200/api/ventas \
            -H "Content-Type: application/json" \
            -d '{"clienteNombre":"CI Runner","clienteEmail":"ci@uv.mx","items":[{"codigoProducto":9401,"cantidad":2}]}'
          stock=$(docker exec ventas-postgres psql -U ventas_user -d ventas_tcsw -tAc "SELECT existencia FROM producto WHERE codigo = 9401;")
          [ "$stock" = "8" ]
          docker compose ps

      - name: Mostrar logs en caso de fallo
        if: failure()
        run: docker compose logs

      - name: Destruir contenedores y volumenes temporales
        if: always()
        run: docker compose down -v